<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>InMo – Tu propiedad, tu oportunidad</title><meta name="description" content="Compra, venta y alquiler de propiedades en Cuba. Sin publicidad."><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"></head><body><main id="app"></main><div class="bar"><nav id="nav"></nav></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script src="common.js"></script>
<script>
let ALL=[],F={op:"",prov:"",mun:"",cat:"",pmin:"",pmax:"",hab:"",ban:"",q:""},FAV=lg("fav"),BUS=lg("bus");
const go=h=>location.hash=h,A=$("#app");
const fav=id=>{const i=FAV.indexOf(id);i>-1?FAV.splice(i,1):FAV.push(id);ls("fav",FAV);view()};
const saveS=()=>{BUS.unshift({l:[F.q,F.cat&&cat(F.cat)[1],F.op,F.mun||F.prov].filter(Boolean).join(" · ")||"Todas las propiedades",f:{...F}});BUS=BUS.slice(0,20);ls("bus",BUS)};
const useS=i=>{F={...BUS[i].f};go("resultados")};
const card=p=>`<div class="pc" onclick="go('propiedad-${p.id}')"><div class="ph" style="${bg(p)}">${p.photos&&p.photos.length?"":ico(cat(p.category)[2])}<span class="tag">${p.operation=="venta"?"Venta":"Alquiler"}</span>${p.status=="sold"?'<span class="tag st">Vendida</span>':p.status=="rented"?'<span class="tag st">Alquilada</span>':""}<span class="cnt">📷 1/${(p.photos||[]).length}</span></div><div class="pi"><b>${esc(p.title)}</b><button class="heart" aria-label="Favorito" onclick="event.stopPropagation();fav('${p.id}')">${FAV.includes(p.id)?"♥":"♡"}</button><span class="pr">${money(p)}</span><span class="sub">📍 ${esc(p.municipality)}, ${esc(p.province)}</span></div></div>`;
const chips=()=>`<div class="f">${[["","Todas"],["venta","Comprar"],["alquiler","Alquilar"]].map(x=>`<button class="chip ${F.op==x[0]?"on":""}" onclick="F.op='${x[0]}';view()">${x[1]}</button>`).join("")}</div>`;
function nav(h){const it=[["inicio","Inicio","M3 11l9-8 9 8v10H3z"],["favoritos","Favoritos","M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"],["busquedas","Mis búsquedas","M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M20 20l-4-4"],["perfil","Perfil","M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21c0-4 4-6 8-6s8 2 8 6"]];
$("#nav").innerHTML=it.map(x=>`<a href="#${x[0]}" class="${h==x[0]||(h=="resultados"&&x[0]=="inicio")?"on":""}">${ico(x[2])}${x[1]}</a>`).join("")}
function view(){const h=location.hash.slice(1)||"inicio";nav(h);
if(h=="inicio"){A.innerHTML=head+`<div class="hero"><h1>Encuentra tu próximo lugar.</h1><div class="sub">Compra y alquiler de propiedades en Cuba.</div></div><div class="sbox"><input id="q" placeholder="¿Qué estás buscando?" value="${esc(F.q)}"><select onchange="F.prov=this.value;F.mun='';view()">${opts(Object.keys(LOC),F.prov,"Toda Cuba")}</select>${F.prov?`<select onchange="F.mun=this.value">${opts(LOC[F.prov],F.mun,"Todos los municipios")}</select>`:""}${chips()}<button class="btn" onclick="F.q=$('#q').value;saveS();go('resultados')">Buscar</button></div><h2>Explora por categorías</h2><div class="cats">${CATS.map(c=>`<button class="cat" onclick="F.cat='${c[0]}';go('resultados')">${ico(c[2])}${c[1]}</button>`).join("")}</div><h2>Recientes</h2><div class="grid">${ALL.slice(0,6).map(card).join("")||'<div class="msg sub">Pronto habrá propiedades publicadas.</div>'}</div>`}
else if(h=="resultados"){const L=ALL.filter(p=>{const t=(p.title+" "+p.description+" "+p.municipality+" "+p.province).toLowerCase();return(!F.q||t.includes(F.q.toLowerCase()))&&(!F.op||p.operation==F.op)&&(!F.prov||p.province==F.prov)&&(!F.mun||p.municipality==F.mun)&&(!F.cat||p.category==F.cat)&&(!F.pmin||p.price>=+F.pmin)&&(!F.pmax||p.price<=+F.pmax)&&(!F.hab||p.bedrooms>=+F.hab)&&(!F.ban||p.bathrooms>=+F.ban)});
A.innerHTML=head+chips()+`<details class="box" ${F.cat||F.prov||F.pmin||F.pmax||F.hab||F.ban?"open":""}><summary><b>Filtros</b></summary><div class="row"><div><label>Provincia</label><select onchange="F.prov=this.value;F.mun='';view()">${opts(Object.keys(LOC),F.prov,"Todas")}</select></div><div><label>Municipio</label><select onchange="F.mun=this.value;view()">${opts(F.prov?LOC[F.prov]:[],F.mun,"Todos")}</select></div></div><label>Categoría</label><select onchange="F.cat=this.value;view()">${opts(CATS.map(c=>[c[0],c[1]]),F.cat,"Todas")}</select><div class="row"><div><label>Precio mín.</label><input type="number" value="${F.pmin}" onchange="F.pmin=this.value;view()"></div><div><label>Precio máx.</label><input type="number" value="${F.pmax}" onchange="F.pmax=this.value;view()"></div><div><label>Habitaciones (mín.)</label><input type="number" value="${F.hab}" onchange="F.hab=this.value;view()"></div><div><label>Baños (mín.)</label><input type="number" value="${F.ban}" onchange="F.ban=this.value;view()"></div></div><p class="f"><button class="btn ghost sm" onclick="F={op:'',prov:'',mun:'',cat:'',pmin:'',pmax:'',hab:'',ban:'',q:''};view()">Limpiar</button><button class="btn sm" onclick="saveS();alert('Búsqueda guardada')">Guardar búsqueda</button></p></details><p class="sub">${L.length} propiedades</p><div class="grid">${L.map(card).join("")||'<div class="msg sub">Sin resultados. Prueba otros filtros.</div>'}</div>`}
else if(h.startsWith("propiedad-")){const p=ALL.find(x=>x.id==h.slice(10));if(!p){A.innerHTML=head+'<div class="msg">Propiedad no encontrada.</div>';return}
sb.rpc("add_view",{pid:p.id});const n=(p.photos||[]).length,g=(n?p.photos:[0]).map((_,i)=>`<div class="ph" style="${bg(p,i)}">${n?"":ico(cat(p.category)[2])}<span class="cnt">${i+1}/${n||1}</span></div>`).join(""),m=encodeURIComponent("Hola, me interesa: "+p.title+" (InMo)");
A.innerHTML=head+`<button class="chip" onclick="history.back()">← Volver</button><div class="gal" style="margin-top:8px">${g}</div><div class="box"><span class="pill">${p.operation=="venta"?"Venta":"Alquiler"}</span> <span class="pill">${cat(p.category)[1]}</span><h1 style="font-size:1.5rem">${esc(p.title)}</h1><div class="pr" style="font-size:1.5rem">${money(p)}</div><div class="sub">📍 ${esc(p.municipality)}, ${esc(p.province)}${p.address?" · "+esc(p.address):""}</div><p>${esc(p.description)}</p><h2>Características</h2><div class="f"><span class="pill">🛏 ${p.bedrooms} hab.</span><span class="pill">🚿 ${p.bathrooms} baños</span><span class="pill">📐 ${p.area} m²</span><span class="pill">Estado: ${esc(p.condition)}</span>${p.extras?`<span class="pill">${esc(p.extras)}</span>`:""}</div></div><div class="box"><b>Contacto</b><div class="sub">${esc(p.owner_name)}</div><p class="f"><a class="btn wa" href="https://wa.me/${p.owner_whatsapp}?text=${m}" target="_blank" rel="noopener">WhatsApp</a><a class="btn" href="tel:+${p.owner_phone}">Llamar</a><button class="btn ghost" onclick="fav('${p.id}')">${FAV.includes(p.id)?"♥ En favoritos":"♡ Guardar"}</button></p></div>`}
else if(h=="favoritos"){A.innerHTML=head+`<h1>Favoritos</h1><div class="grid">${ALL.filter(p=>FAV.includes(p.id)).map(card).join("")||'<div class="msg sub">Aún no tienes favoritos. Toca ♡ en una propiedad.</div>'}</div>`}
else if(h=="busquedas"){A.innerHTML=head+"<h1>Mis búsquedas</h1>"+(BUS.map((b,i)=>`<div class="box"><b>${esc(b.l)}</b><p class="f"><button class="btn sm" onclick="useS(${i})">Ver</button><button class="btn ghost sm" onclick="BUS.splice(${i},1);ls('bus',BUS);view()">Borrar</button></p></div>`).join("")||'<div class="msg sub">Tus búsquedas guardadas aparecerán aquí.</div>')}
else if(h=="perfil"){A.innerHTML=head+'<h1>Perfil</h1><div class="box"><p class="sub">Usa InMo sin registrarte. ¿Quieres publicar tu propiedad? Pide tu enlace privado de publicación.</p><div class="free">✅ InMo es gratuito durante el lanzamiento. Sin publicidad.</div></div>'}
else go("inicio")}
addEventListener("hashchange",view);
(async()=>{view();const r=await sb.from("properties").select("*").order("created_at",{ascending:false});ALL=r.data||[];view()})();
</script></body></html>
