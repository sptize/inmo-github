<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>InMo – Administración</title><meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light"><link rel="manifest" href="manifest-admin.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script src="common.js"></script>
<script>
const A=$("#app");let TAB="pen",ROWS=[],LK=[],SUB={enabled:false,plans:[]},sub=false;
const ST={pending:"Pendiente",approved:"Aprobada",rejected:"Rechazada",sold:"Vendida",rented:"Alquilada"};
const lstate=l=>l.status=="disabled"?"desactivado":l.status=="used"?"utilizado":new Date(l.expires_at)<new Date()?"vencido":"pendiente";
const lurl=t=>new URL("publicar.html?t="+t,location.href).href;
async function init(){const s=(await sb.auth.getSession()).data.session;s?dash():login()}
function login(){A.innerHTML=head+'<h1>Administración</h1><div class="box"><label>Correo</label><input id="em" type="email"><label>Contraseña</label><input id="pw" type="password"><p><button class="btn" onclick="doLogin()">Entrar</button></p></div>'}
async function doLogin(){const r=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});r.error?alert("No se pudo entrar: "+r.error.message):dash()}
async function load(){ROWS=(await sb.from("properties").select("*").order("created_at",{ascending:false})).data||[];LK=(await sb.from("publish_links").select("*").order("created_at",{ascending:false})).data||[];const s=(await sb.from("settings").select("value").eq("key","subscriptions").single()).data;if(s)SUB=s.value}
async function dash(){await load();if(!sub){sub=true;sb.channel("p").on("postgres_changes",{event:"INSERT",schema:"public",table:"properties"},async x=>{await load();draw();alert2("Nueva propiedad pendiente: "+x.new.title)}).subscribe()}draw()}
function alert2(m){const d=document.createElement("div");d.className="toast";d.textContent="🏠 "+m;document.body.appendChild(d);navigator.vibrate&&navigator.vibrate(200);setTimeout(()=>d.remove(),6000);
if(window.Notification&&Notification.permission=="granted"&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification("InMo",{body:m,icon:"icon-192.png"}))}
const VAPID="BJ6CjLPF37uBk2pZAdEMmJJDunsI-f2essb4CHDvYDwO5M7Jh2v0oHXzp4SmWEKXeath9HoBSNcD_a0XDM3cn8w";
const u8=s=>{const p="=".repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function ask(){try{if(!("PushManager"in window))return alert("Este navegador no admite avisos push. En iPhone, instala la app en la pantalla de inicio.");const p=await Notification.requestPermission();if(p!="granted")return alert("Avisos bloqueados");const reg=await navigator.serviceWorker.ready;const s=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)});const j=s.toJSON();const r=await sb.from("push_subscriptions").upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth});alert(r.error?"Error: "+r.error.message:"Avisos activados en este teléfono")}catch(e){alert("Error: "+e.message)}}
function draw(){const np=ROWS.filter(p=>p.status=="pending").length,T=[["pen","Pendientes"+(np?` <span class="pen">${np}</span>`:"")],["all","Todas"],["lnk","Enlaces"],["sub","Suscripciones"]];let b="";
const row=p=>`<div class="box"><b>${esc(p.title)}</b> <span class="pill">${ST[p.status]}</span><div class="sub">${money(p)} · ${esc(p.municipality)}, ${esc(p.province)} · 👁 ${p.views}</div><div class="sub">${esc(p.owner_name)} · wa.me/${esc(p.owner_whatsapp)}</div><div class="pics" style="margin:8px 0">${(p.photos||[]).slice(0,3).map(u=>`<div style="background-image:url(${u})"></div>`).join("")}</div><p class="sub">${esc(p.description)}</p><p class="f">${p.status=="pending"?`<button class="btn sm" onclick="st('${p.id}','approved')">Aprobar</button><button class="btn red sm" onclick="st('${p.id}','rejected')">Rechazar</button>`:""}${p.status=="approved"?`<button class="btn ghost sm" onclick="st('${p.id}','${p.operation=="venta"?"sold":"rented"}')">Marcar ${p.operation=="venta"?"vendida":"alquilada"}</button>`:""}<button class="btn ghost sm" onclick="ed('${p.id}')">Editar</button><button class="btn ghost sm" onclick="del('${p.id}')">Eliminar</button></p></div>`;
if(TAB=="pen")b=ROWS.filter(p=>p.status=="pending").map(row).join("")||'<div class="msg sub">No hay propiedades pendientes.</div>';
if(TAB=="all")b=ROWS.map(row).join("");
if(TAB=="lnk")b=`<div class="box"><label>Caduca en (días)</label><input id="dias" type="number" value="7"><p><button class="btn" onclick="mk()">Generar enlace privado</button></p></div>`+LK.map(l=>`<div class="box"><span class="pill">${lstate(l)}</span> <span class="sub">vence ${new Date(l.expires_at).toLocaleDateString("es")}</span><div style="word-break:break-all;font-size:.8rem;margin:6px 0">${lurl(l.token)}</div><p class="f"><a class="btn wa sm" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent("Publica tu propiedad en InMo (enlace de un solo uso): "+lurl(l.token))}">Enviar por WhatsApp</a>${lstate(l)=="pendiente"?`<button class="btn red sm" onclick="off('${l.token}')">Invalidar</button>`:""}</p></div>`).join("");
if(TAB=="sub")b=`<div class="box"><label><input type="checkbox" style="width:auto" ${SUB.enabled?"checked":""} onchange="SUB.enabled=this.checked;svs()"> Cobro por suscripción activado</label><p class="${SUB.enabled?"":"free"}">${SUB.enabled?"Cobros activos.":"Modo gratuito: sin pantallas de pago."}</p></div>`+SUB.plans.map((p,i)=>`<div class="box"><b>${esc(p.name)}</b><div class="row"><div><label>USD/mes</label><input type="number" value="${p.price}" onchange="SUB.plans[${i}].price=+this.value;svs()"></div><div><label>Máx. anuncios</label><input type="number" value="${p.limit}" onchange="SUB.plans[${i}].limit=+this.value;svs()"></div></div></div>`).join("");
A.innerHTML=head+`<h1>Panel</h1><div class="chips">${T.map(t=>`<button class="chip ${TAB==t[0]?"on":""}" onclick="TAB='${t[0]}';draw()">${t[1]}</button>`).join("")}<button class="chip" onclick="ask()">🔔 Avisos</button><button class="chip" onclick="sb.auth.signOut().then(()=>location.reload())">Salir</button></div>`+b}
const svs=async()=>{await sb.from("settings").update({value:SUB}).eq("key","subscriptions");draw()};
async function st(id,s){await sb.from("properties").update({status:s}).eq("id",id);await load();draw()}
async function del(id){if(confirm("¿Eliminar este anuncio?")){await sb.from("properties").delete().eq("id",id);await load();draw()}}
async function ed(id){const p=ROWS.find(x=>x.id==id),t=prompt("Título",p.title);if(t===null)return;const pr=prompt("Precio",p.price);await sb.from("properties").update({title:t,price:+pr||p.price}).eq("id",id);await load();draw()}
async function mk(){const a=new Uint8Array(12);crypto.getRandomValues(a);const t=[...a].map(x=>"abcdefghijkmnpqrstuvwxyz23456789"[x%32]).join("");await sb.from("publish_links").insert({token:t,expires_at:new Date(Date.now()+(+$("#dias").value||7)*864e5).toISOString()});await load();draw()}
async function off(t){await sb.from("publish_links").update({status:"disabled"}).eq("token",t);await load();draw()}
init();
</script></body></html>
