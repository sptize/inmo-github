<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Publicar propiedad – InMo</title><meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="style.css"></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script src="common.js"></script>
<script>
const T=new URLSearchParams(location.search).get("t"),A=$("#app");let PH=[];
const MS={used:"Este enlace ya fue utilizado y no permite más envíos.",expired:"Este enlace venció. Solicita uno nuevo al administrador.",disabled:"Este enlace fue desactivado por el administrador.",invalid:"El enlace no existe o está incompleto."};
const inp=(id,l,t="text")=>`<div><label>${l}</label><input id="${id}" type="${t}"></div>`;
(async()=>{let s="invalid";let er="";if(T){const r=await sb.rpc("check_link",{t:T});s=r.data||"invalid";if(r.error)er=r.error.message}
if(s!="ok"){A.innerHTML=head+`<div class="msg"><h2 class="bad">Enlace no disponible</h2><p class="sub">${er?"Error de conexión con la base de datos: "+esc(er):!T?"Falta el código del enlace. Abre el enlace completo que te envió el administrador (termina en ?t=…).":MS[s]||MS.invalid}</p></div>`;return}
A.innerHTML=head+`<h1>Publicar propiedad</h1><div class="free">Este enlace permite una sola publicación. Será revisada antes de aparecer.</div>
<div class="box"><h2 style="margin-top:0">Datos de la propiedad</h2>${inp("title","Título del anuncio")}<div class="row"><div><label>Categoría</label><select id="category">${opts(CATS.map(c=>[c[0],c[1]]),"","Elegir")}</select></div><div><label>Operación</label><select id="operation"><option value="venta">Venta</option><option value="alquiler">Alquiler</option></select></div>${inp("price","Precio","number")}<div><label>Moneda</label><select id="currency"><option>USD</option><option>CUP</option><option>EUR</option><option>MLC</option></select></div><div><label>Provincia</label><select id="province" onchange="$('#municipality').innerHTML=opts(LOC[this.value]||[],'','Elegir')">${opts(Object.keys(LOC),"","Elegir")}</select></div><div><label>Municipio</label><select id="municipality"><option value="">Elegir</option></select></div></div>${inp("address","Dirección o zona")}<label>Descripción</label><textarea id="description"></textarea></div>
<div class="box"><h2 style="margin-top:0">Características</h2><div class="row">${inp("bedrooms","Habitaciones","number")}${inp("bathrooms","Baños","number")}${inp("area","Superficie (m²)","number")}<div><label>Estado</label><select id="condition"><option>Excelente</option><option>Muy bueno</option><option>Bueno</option><option>Regular</option><option>Necesita reparación</option></select></div></div>${inp("extras","Otras características")}</div>
<div class="box"><h2 style="margin-top:0">Fotografías</h2><input id="file" type="file" accept="image/*" multiple onchange="addPh(this.files)"><p class="sub" style="font-size:.85rem">La primera foto es la principal.</p><div class="pics" id="pics"></div></div>
<div class="box"><h2 style="margin-top:0">Datos del propietario</h2>${inp("owner_name","Nombre")}<div class="row">${inp("owner_phone","Teléfono","tel")}${inp("owner_whatsapp","WhatsApp","tel")}</div><div class="free" id="walink" style="margin-top:10px"></div><label>Contacto preferido</label><select id="preferred_contact"><option>WhatsApp</option><option>Llamada</option></select></div>
<p class="f"><button class="btn ghost" onclick="prev()">Vista previa</button><button class="btn red" id="go" onclick="send()">Enviar propiedad</button></p><div id="prev"></div>`;
for(const i of["owner_phone","owner_whatsapp"])$("#"+i).oninput=wl;wl();drawPh()})();
function wl(){const n=waNum($("#owner_whatsapp").value||$("#owner_phone").value);$("#walink").innerHTML=n.length>=10?`Tu enlace directo de WhatsApp: <b>wa.me/${n}</b>`:"Escribe tu número (ej. 5xxxxxxx) y se creará tu enlace de WhatsApp."}
async function addPh(fs){for(const f of fs){const b=await createImageBitmap(f),k=Math.min(1,1100/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=b.width*k;c.height=b.height*k;c.getContext("2d").drawImage(b,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.72));PH.push({blob,url:URL.createObjectURL(blob)})}$("#file").value="";drawPh()}
function drawPh(){$("#pics").innerHTML=PH.map((p,i)=>`<div class="${i?"":"m"}" style="background-image:url(${p.url})">${i?`<button style="top:3px" onclick="PH.unshift(PH.splice(${i},1)[0]);drawPh()">Hacer principal</button>`:'<button style="top:3px;background:var(--red)">Principal</button>'}<button style="right:3px" onclick="PH.splice(${i},1);drawPh()">Quitar</button></div>`).join("")}
function gather(){const v=i=>$("#"+i).value;return{title:v("title").trim(),category:v("category"),operation:v("operation"),price:+v("price"),currency:v("currency"),province:v("province"),municipality:v("municipality"),address:v("address"),description:v("description"),bedrooms:+v("bedrooms")||0,bathrooms:+v("bathrooms")||0,area:+v("area")||0,condition:v("condition"),extras:v("extras"),owner_name:v("owner_name").trim(),owner_phone:waNum(v("owner_phone")),owner_whatsapp:waNum(v("owner_whatsapp")||v("owner_phone")),preferred_contact:v("preferred_contact")}}
function prev(){const p=gather();$("#prev").innerHTML=`<h2>Vista previa</h2><div class="pc" style="max-width:380px"><div class="ph" style="${PH[0]?`background-image:url(${PH[0].url})`:""}"><span class="tag">${p.operation=="venta"?"Venta":"Alquiler"}</span><span class="cnt">📷 1/${PH.length}</span></div><div class="pi"><b>${esc(p.title)}</b><span></span><span class="pr">${p.price?money(p):""}</span><span class="sub">📍 ${esc(p.municipality)}, ${esc(p.province)}</span></div></div><p class="sub">${esc(p.description)}</p>`}
async function send(){const p=gather();if(!p.title||!p.category||!p.price||!p.province||!p.municipality||!p.owner_name||p.owner_whatsapp.length<10||!PH.length){alert("Completa título, categoría, precio, ubicación, nombre, un número válido y al menos una foto.");return}
const b=$("#go");b.disabled=true;b.textContent="Enviando…";
try{p.photos=[];for(const f of PH){const path=T+"/"+crypto.randomUUID()+".jpg",u=await sb.storage.from("photos").upload(path,f.blob,{contentType:"image/jpeg"});if(u.error)throw u.error;p.photos.push(sb.storage.from("photos").getPublicUrl(path).data.publicUrl)}
const r=await sb.rpc("submit_property",{t:T,d:p});if(r.error)throw r.error;
A.innerHTML=head+'<div class="msg"><h2 class="ok">¡Propiedad enviada!</h2><p class="sub">Quedó pendiente de revisión. Este enlace ya no puede usarse otra vez.</p></div>'}
catch(e){alert("No se pudo enviar: "+(e.message||e));b.disabled=false;b.textContent="Enviar propiedad"}}
</script></body></html>
